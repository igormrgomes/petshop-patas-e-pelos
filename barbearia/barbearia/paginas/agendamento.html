<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento - Barbearia </title>
</head>

<body>

    <h1>Agendar horário</h1>

    <form onsubmit="validarAgendamento(event)">
        
    <label>Barbeiro:</label>
        <select name="barbeiro">
    <option value="barbeiro1">Ítalo</option>
    <option value="barbeiro2">Gabriel</option>

        </select>


        <label>Serviço:</label>
        <select id="servico" onchange="atualizarPreco()">
            <option value="Corte">Corte</option>
            <option value="Barba">Barba</option>
            <option value="Combo">Combo</option>
            <option value="Outro">Outro</option>
        </select>
        <br>

        <label for="valor-servico">Preço Estimado:</label>
        <input type="text" id="valor-servico" readonly>

<br>

<div id="campo-outro" style="display: none;">
    <label>Descreva o serviço:</label>
    <input type="text" id="detalhe-servico">
</div>

        <label>Data do agendamento:</label>
        <input type="date" id="data-agendamento" name="data">
        <br>

        <label>Horário:</label>
        <input type="time" name="horario">
        <br>

        <button type="submit">Confirmar Agendamento</button>


    </form>

    <script src="../js/agendamento.js"></script>

</body>

</html>
